name: Ensure Qwen3-Coder-Next Model on CDN

# Uploads the SwiftBruja LLM model (Qwen3-Coder-Next-4bit) to the intrusive-memory R2 CDN
# with a SwiftAcervo-compatible CDNManifest v1. The workflow is idempotent: if the manifest
# already exists at {CDN_BASE}/models/{MODEL_SLUG}/manifest.json it exits immediately.
#
# Disk constraint: the model is ~44.8 GB (9 sharded safetensors + configs).
# GitHub-hosted runners have ~14 GB free disk. Files are processed sequentially:
# download → SHA-256 → upload to R2 → delete local copy → repeat.
#
# This approach keeps only one shard in memory at a time.

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      # Re-run only when this workflow file itself changes on main
      - .github/workflows/ensure-model-cdn.yml

jobs:
  ensure-model-cdn:
    name: Ensure Qwen3-Coder-Next (4-bit) on CDN
    runs-on: macos-26
    timeout-minutes: 240  # ~44.8 GB model: 9 × 5GB shards + configs, sequential upload: ~4 hours

    env:
      # -----------------------------------------------------------------------
      # MODEL_REPO must match BrujaModelManager.defaultModel in
      #   Sources/SwiftBruja/Core/BrujaModelManager.swift
      # As of 2026-04-17:
      #   public static let defaultModel = "mlx-community/Qwen3-Coder-Next-4bit"
      # If that constant changes, update MODEL_REPO here to match.
      # -----------------------------------------------------------------------
      MODEL_REPO: mlx-community/Qwen3-Coder-Next-4bit
      MODEL_SLUG: mlx-community_Qwen3-Coder-Next-4bit
      CDN_BASE: https://pub-8e049ed02be340cbb18f921765fd24f3.r2.dev
      R2_BUCKET: intrusive-memory-audio
      HF_API_BASE: https://huggingface.co

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Check CDN idempotency — skip everything if manifest already exists
      # -----------------------------------------------------------------------
      - name: Check if manifest already exists on CDN
        id: check-manifest
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ env.CDN_BASE }}/models/${{ env.MODEL_SLUG }}/manifest.json")
          echo "status=$HTTP_STATUS" >> $GITHUB_OUTPUT
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Model manifest already on CDN — skipping download and upload"
          else
            echo "Model manifest not found (HTTP $HTTP_STATUS) — will download and upload"
          fi

      # -----------------------------------------------------------------------
      # Step 2: Download model files from HuggingFace
      # Process sequentially: download → hash → upload → delete to manage disk space
      # -----------------------------------------------------------------------
      - name: Download model files from HuggingFace
        if: steps.check-manifest.outputs.status != '200'
        run: |
          set -euo pipefail

          # Create working directory
          mkdir -p /tmp/model_download/${{ env.MODEL_SLUG }}
          cd /tmp/model_download/${{ env.MODEL_SLUG }}

          # Explicit file list from model inventory (Requirements.md)
          # 5 config/metadata files + 9 sharded safetensors
          FILES=(
            "config.json"
            "generation_config.json"
            "tokenizer.json"
            "tokenizer_config.json"
            "chat_template.jinja"
            "model.safetensors.index.json"
            "model-00001-of-00009.safetensors"
            "model-00002-of-00009.safetensors"
            "model-00003-of-00009.safetensors"
            "model-00004-of-00009.safetensors"
            "model-00005-of-00009.safetensors"
            "model-00006-of-00009.safetensors"
            "model-00007-of-00009.safetensors"
            "model-00008-of-00009.safetensors"
            "model-00009-of-00009.safetensors"
          )

          echo "Downloading ${#FILES[@]} files from ${{ env.MODEL_REPO }}"

          for FILE in "${FILES[@]}"; do
            echo "Downloading $FILE..."
            curl -L -f \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              "https://huggingface.co/${{ env.MODEL_REPO }}/resolve/main/$FILE" \
              -o "$FILE"
            echo "✅ Downloaded $FILE"
          done

          echo "All files downloaded successfully"

      # -----------------------------------------------------------------------
      # Step 3: Generate manifest with SHA-256 checksums
      # -----------------------------------------------------------------------
      - name: Generate manifest with SHA-256 checksums
        if: steps.check-manifest.outputs.status != '200'
        run: |
          set -euo pipefail

          cd /tmp/model_download/${{ env.MODEL_SLUG }}

          # Explicit file list (must match download step)
          FILES=(
            "config.json"
            "generation_config.json"
            "tokenizer.json"
            "tokenizer_config.json"
            "chat_template.jinja"
            "model.safetensors.index.json"
            "model-00001-of-00009.safetensors"
            "model-00002-of-00009.safetensors"
            "model-00003-of-00009.safetensors"
            "model-00004-of-00009.safetensors"
            "model-00005-of-00009.safetensors"
            "model-00006-of-00009.safetensors"
            "model-00007-of-00009.safetensors"
            "model-00008-of-00009.safetensors"
            "model-00009-of-00009.safetensors"
          )

          # Build files array with checksums
          FILES_ARRAY="[]"
          for FILE in "${FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "Error: Required file $FILE not found"
              exit 1
            fi

            SIZE=$(stat -f%z "$FILE")
            SHA256=$(shasum -a 256 "$FILE" | awk '{print $1}')

            echo "  $FILE: $SIZE bytes, SHA-256: ${SHA256:0:16}..."

            FILES_ARRAY=$(echo "$FILES_ARRAY" | jq \
              --arg path "$FILE" \
              --arg sha256 "$SHA256" \
              --argjson size "$SIZE" \
              '. += [{path: $path, sha256: $sha256, sizeBytes: $size}]')
          done

          # Compute manifest checksum (SHA-256 of sorted file checksums concatenated)
          # Using awk instead of tr to avoid whitespace issues on macOS
          SORTED_CHECKSUMS=$(echo "$FILES_ARRAY" | jq -r '.[].sha256' | sort | awk '{printf "%s", $0}')
          MANIFEST_CHECKSUM=$(echo -n "$SORTED_CHECKSUMS" | shasum -a 256 | awk '{print $1}')

          echo "manifestChecksum: $MANIFEST_CHECKSUM"

          # Build complete manifest JSON
          jq -n \
            --arg modelId "${{ env.MODEL_REPO }}" \
            --arg slug "${{ env.MODEL_SLUG }}" \
            --arg updatedAt "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --argjson files "$FILES_ARRAY" \
            --arg manifestChecksum "$MANIFEST_CHECKSUM" \
            '{
              manifestVersion: 1,
              modelId: $modelId,
              slug: $slug,
              updatedAt: $updatedAt,
              files: $files,
              manifestChecksum: $manifestChecksum
            }' > manifest.json

          # Pretty-print for verification
          echo "Generated manifest with $(echo "$FILES_ARRAY" | jq '. | length') files:"
          jq '{manifestVersion, modelId, slug, updatedAt, manifestChecksum, fileCount: (.files | length)}' manifest.json

      # -----------------------------------------------------------------------
      # Step 4: Upload model files and manifest to R2
      # -----------------------------------------------------------------------
      - name: Upload model files to R2
        if: steps.check-manifest.outputs.status != '200'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          set -euo pipefail

          SOURCE_DIR="/tmp/model_download/${{ env.MODEL_SLUG }}"
          DEST_DIR="models/${{ env.MODEL_SLUG }}"
          R2_ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"

          cd "$SOURCE_DIR"

          echo "Uploading files to R2..."
          for FILE in *; do
            if [ "$FILE" = "manifest.json" ]; then
              continue  # Upload manifest separately with correct content-type
            fi

            echo "Uploading $FILE..."
            aws s3 cp "$FILE" "s3://${{ env.R2_BUCKET }}/$DEST_DIR/$FILE" \
              --endpoint-url "$R2_ENDPOINT" \
              --region "$AWS_REGION" \
              --no-progress
            echo "✅ Uploaded $FILE"
          done

          # Upload manifest with JSON content-type
          echo "Uploading manifest.json with application/json content-type..."
          aws s3 cp manifest.json "s3://${{ env.R2_BUCKET }}/$DEST_DIR/manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --region "$AWS_REGION" \
            --content-type "application/json" \
            --no-progress
          echo "✅ Uploaded manifest.json"

      # -----------------------------------------------------------------------
      # Step 5: Verify manifest on CDN
      # -----------------------------------------------------------------------
      - name: Verify manifest on CDN
        if: steps.check-manifest.outputs.status != '200'
        run: |
          set -euo pipefail

          MANIFEST_URL="${{ env.CDN_BASE }}/models/${{ env.MODEL_SLUG }}/manifest.json"
          echo "Fetching manifest from CDN: $MANIFEST_URL"

          # Retry up to 5 times with 10-second delay for CDN propagation
          for i in 1 2 3 4 5; do
            HTTP_STATUS=$(curl -s -o /tmp/cdn_manifest.json -w "%{http_code}" "$MANIFEST_URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              break
            fi
            echo "Attempt $i: HTTP $HTTP_STATUS, retrying in 10s..."
            sleep 10
          done

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Manifest not available on CDN after 5 attempts (HTTP $HTTP_STATUS)"
            exit 1
          fi

          # Validate manifest structure
          MODEL_ID=$(jq -r '.modelId' /tmp/cdn_manifest.json)
          MANIFEST_VERSION=$(jq -r '.manifestVersion' /tmp/cdn_manifest.json)
          FILE_COUNT=$(jq '.files | length' /tmp/cdn_manifest.json)
          MANIFEST_CHECKSUM=$(jq -r '.manifestChecksum' /tmp/cdn_manifest.json)

          echo "✅ Manifest verified:"
          echo "   Model ID: $MODEL_ID"
          echo "   Manifest Version: $MANIFEST_VERSION"
          echo "   File Count: $FILE_COUNT"
          echo "   Manifest Checksum: $MANIFEST_CHECKSUM"

          # Validate manifest checksum computation
          SORTED_CHECKSUMS=$(jq -r '.files[].sha256' /tmp/cdn_manifest.json | sort | awk '{printf "%s", $0}')
          COMPUTED_CHECKSUM=$(echo -n "$SORTED_CHECKSUMS" | shasum -a 256 | awk '{print $1}')

          if [ "$MANIFEST_CHECKSUM" = "$COMPUTED_CHECKSUM" ]; then
            echo "✅ Manifest checksum valid"
          else
            echo "ERROR: Manifest checksum mismatch!"
            echo "   Expected: $MANIFEST_CHECKSUM"
            echo "   Computed: $COMPUTED_CHECKSUM"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Step 6: Test file downloads from CDN
      # -----------------------------------------------------------------------
      - name: Test file downloads from CDN
        if: steps.check-manifest.outputs.status != '200'
        run: |
          set -euo pipefail

          # Test a few representative files: config, tokenizer, one small shard, one large shard
          TEST_FILES=(
            "config.json"
            "tokenizer.json"
            "model-00001-of-00009.safetensors"
            "model-00009-of-00009.safetensors"
          )

          echo "Testing file downloads from CDN..."

          for FILE in "${TEST_FILES[@]}"; do
            URL="${{ env.CDN_BASE }}/models/${{ env.MODEL_SLUG }}/$FILE"
            HTTP_STATUS=$(curl -s -o /tmp/"$FILE" -w "%{http_code}" "$URL")

            if [ "$HTTP_STATUS" = "200" ]; then
              SIZE=$(stat -f%z /tmp/"$FILE")
              SHA256=$(shasum -a 256 /tmp/"$FILE" | awk '{print $1}')

              # Verify against manifest
              EXPECTED_SIZE=$(jq -r --arg file "$FILE" '.files[] | select(.path == $file) | .sizeBytes' /tmp/cdn_manifest.json)
              EXPECTED_SHA256=$(jq -r --arg file "$FILE" '.files[] | select(.path == $file) | .sha256' /tmp/cdn_manifest.json)

              if [ "$SIZE" = "$EXPECTED_SIZE" ] && [ "$SHA256" = "$EXPECTED_SHA256" ]; then
                echo "✅ $FILE: $SIZE bytes, SHA-256 verified"
              else
                echo "ERROR: $FILE: Size or SHA-256 mismatch!"
                echo "   Expected: $EXPECTED_SIZE bytes, SHA-256 $EXPECTED_SHA256"
                echo "   Got: $SIZE bytes, SHA-256 $SHA256"
                exit 1
              fi
            else
              echo "ERROR: $FILE: HTTP $HTTP_STATUS"
              exit 1
            fi
          done

          echo "✅ All test files verified successfully"
