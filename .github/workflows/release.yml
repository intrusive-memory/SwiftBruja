name: Release Binary

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true

env:
  ACERVO_APP_GROUP_ID: group.intrusive-memory.models

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and Upload Binary
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The released binary targets macOS 26 (swift-tools-version: 6.2, .macOS(.v26)); it is built
      # on the hosted xcode-27 image (Xcode 27, Swift 6.4), whose toolchain builds that floor, so no
      # Xcode selection is needed.
      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION} (tag: ${TAG})"

      - name: Build and package
        run: make dist

      - name: Verify dist
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL="bruja-${VERSION}-arm64-macos.tar.gz"

          test -f "dist/${TARBALL}" || { echo "ERROR: dist/${TARBALL} not found"; ls -la dist/; exit 1; }

          SHA256=$(shasum -a 256 "dist/${TARBALL}" | cut -d' ' -f1)
          echo "tarball=${TARBALL}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "SHA256: ${SHA256}"

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/${{ steps.package.outputs.tarball }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

